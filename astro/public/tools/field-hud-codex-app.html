<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="refresh" content="0; url=/pigeon" />
    <title>Redirecting to Carrier Pigeon</title>
    <link rel="canonical" href="https://ndcodex.com/pigeon" />
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d0b08;
        color: #e8e2d4;
        font: 16px/1.6 "Courier Prime", "IBM Plex Mono", monospace;
      }

      main {
        width: min(32rem, calc(100vw - 3rem));
        padding: 1.5rem 1.75rem;
        border: 1px solid rgba(201, 161, 90, 0.28);
        background: rgba(201, 161, 90, 0.05);
      }

      p {
        margin: 0 0 0.75rem;
      }

      a {
        color: #d8c39a;
      }
    </style>
    <script>
      window.location.replace('/pigeon');
    </script>
  </head>
  <body>
    <main>
      <p>The Field HUD publish tool has been folded into Carrier Pigeon.</p>
      <p><a href="/pigeon">Continue to /pigeon</a></p>
    </main>
  </body>
</html>
