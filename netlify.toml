[build]
  base = "astro"
  command = "npm run build"
  publish = "dist"

[context.production]
  command = "CODEX_ENFORCE_PROD_DEPLOY_GUARD=1 npm run build"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/codex/:slug/hud"
  to = "/objects/:slug/hud"
  status = 301
  force = true

[[redirects]]
  from = "/codex/:slug/plate"
  to = "/objects/:slug/hud"
  status = 301
  force = true
